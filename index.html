<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Digest</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg-deep: #0f0018;
    --bg-mid: #1a0025;
    --bg-card: #22003080;
    --bg-card-hover: #2e004090;
    --accent: #c840ff;
    --accent-dim: #8a20b8;
    --accent-glow: #d060ff40;
    --text-primary: #e8daf0;
    --text-secondary: #a080b8;
    --text-muted: #705888;
    --border: #3a1850;
    --tag-bg: #2a103a;
  }

  html { height: 100%; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 0%, #3a007020 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, #20003820 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 880px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  /* ── Header ── */
  .header {
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #f080ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: .25rem;
  }

  .header .date {
    font-family: 'JetBrains Mono', monospace;
    font-size: .85rem;
    color: var(--text-muted);
  }

  .header .date .note {
    color: #8a6070;
  }

  .header .stats {
    display: flex;
    gap: 1.5rem;
    margin-top: .75rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: .8rem;
    color: var(--text-secondary);
  }

  .header .stats span {
    color: var(--accent);
    font-weight: 600;
  }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    gap: .5rem;
    margin-top: 1rem;
  }

  .tab {
    font-family: 'JetBrains Mono', monospace;
    font-size: .8rem;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    padding: .4rem 1.1rem;
    cursor: pointer;
    transition: color .2s ease, background .2s ease;
  }

  .tab:hover {
    color: var(--text-primary);
    background: var(--bg-card);
  }

  .tab.active {
    color: var(--accent);
    border-color: var(--accent-dim);
    background: var(--bg-mid);
    box-shadow: inset 0 2px 0 var(--accent);
  }

  /* ── Digest Text ── */
  .digest-text {
    margin-bottom: 3rem;
  }

  .digest-text h2 {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--accent);
    margin-top: 2rem;
    margin-bottom: .5rem;
    letter-spacing: .02em;
  }

  .digest-text p {
    color: var(--text-primary);
    font-size: .95rem;
    margin: .5rem 0;
    opacity: .92;
  }

  .digest-text ul {
    margin: .5rem 0;
    padding-left: 1.25rem;
  }

  .digest-text li {
    color: var(--text-primary);
    font-size: .95rem;
    margin: .3rem 0;
    opacity: .92;
  }

  .digest-text li::marker {
    color: var(--accent);
  }

  .digest-text strong {
    color: var(--accent);
    font-weight: 600;
  }

  /* ── Clusters ── */
  .clusters-header {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: .6rem;
  }

  .clusters-header::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 1.2em;
    background: var(--accent);
    border-radius: 2px;
  }

  .cluster {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    transition: background .3s ease, border-color .3s ease;
    backdrop-filter: blur(8px);
  }

  .cluster:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent-dim);
  }

  .cluster-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: .72rem;
    color: var(--text-muted);
    margin-bottom: .5rem;
    display: flex;
    flex-wrap: wrap;
    gap: .4rem 1.2rem;
  }

  .cluster-meta .label {
    color: var(--accent-dim);
  }

  .cluster-summary {
    font-size: .95rem;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: .75rem;
    line-height: 1.55;
  }

  .cluster-tags {
    display: flex;
    flex-wrap: wrap;
    gap: .35rem;
    margin-bottom: .75rem;
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: .68rem;
    background: var(--tag-bg);
    color: var(--accent);
    padding: .2rem .55rem;
    border-radius: 4px;
    border: 1px solid #3a185060;
  }

  .cluster-sources {
    font-family: 'JetBrains Mono', monospace;
    font-size: .72rem;
    color: var(--text-muted);
    margin-bottom: .5rem;
  }

  .cluster-sources span {
    color: var(--text-secondary);
  }

  .cluster-toggle {
    font-family: 'JetBrains Mono', monospace;
    font-size: .78rem;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
    padding: .35rem .8rem;
    border-radius: 6px;
    cursor: pointer;
    transition: all .2s ease;
  }

  .cluster-toggle:hover {
    background: var(--accent);
    color: var(--bg-deep);
    border-color: var(--accent);
  }

  .cluster-reps {
    margin-top: .75rem;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height .4s ease, opacity .3s ease;
  }

  .cluster-reps.open {
    max-height: 5000px;
    opacity: 1;
  }

  .rep-item {
    font-size: .82rem;
    color: var(--text-secondary);
    padding: .65rem 0;
    border-top: 1px solid #2a103a;
    line-height: 1.5;
    word-break: break-word;
  }

  .rep-item img {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    margin-top: .4rem;
  }

  .rep-item a {
    color: var(--accent);
    text-decoration: none;
  }

  .rep-item a:hover {
    text-decoration: underline;
  }

  .rep-item table {
    width: 100%;
    border-collapse: collapse;
  }

  /* ── Loading / empty / error ── */
  .loading {
    text-align: center;
    padding: 4rem 0;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: .9rem;
  }

  .loading .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: .75rem;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: .85rem;
    background: #1a002520;
    border: 1px dashed var(--border);
    border-radius: 12px;
  }

  .empty-state a {
    color: var(--accent);
  }

  .error {
    text-align: center;
    padding: 3rem;
    color: #ff6080;
    font-family: 'JetBrains Mono', monospace;
    font-size: .85rem;
    background: #40001520;
    border: 1px solid #40001540;
    border-radius: 12px;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .container { padding: 1.25rem 1rem 3rem; }
    .header h1 { font-size: 1.4rem; }
    .header .stats { flex-direction: column; gap: .3rem; }
    .cluster { padding: 1rem; }
  }
</style>
</head>
<body>

<div class="container">
  <div id="root">
    <div class="loading">
      <div class="spinner"></div>
      <div>Loading digests…</div>
    </div>
  </div>
</div>

<script>
(async function() {
  const root = document.getElementById('root');

  const TABS = [
    { id: 'hourly', label: 'Hourly', file: 'hourly.json' },
    { id: 'daily', label: 'Daily', file: 'daily.json' },
  ];

  const dataByTab = {};
  const loadError = {};

  // Load both digests up front (they're small) so tab switching is instant.
  await Promise.all(TABS.map(async (t) => {
    try {
      const resp = await fetch(`./${t.file}`);
      if (!resp.ok) throw new Error(`${t.file} not available (${resp.status})`);
      dataByTab[t.id] = await resp.json();
    } catch (err) {
      loadError[t.id] = err;
    }
  }));

  if (TABS.every((t) => loadError[t.id])) {
    root.innerHTML = `<div class="error">⚠ ${loadError.hourly.message}<br><br>Make sure <code>hourly.json</code> / <code>daily.json</code> are in the same directory as this page.</div>`;
    return;
  }

  // Default to the tab with the most recent digest.
  let activeTab = 'hourly';
  let best = NaN;
  for (const t of TABS) {
    if (!dataByTab[t.id]) continue;
    const ts = getDigestDate(dataByTab[t.id]).date.getTime();
    if (ts > best) { best = ts; activeTab = t.id; }
  }

  // ── Header + tabs (persistent) ──
  const header = el('div', 'header');
  header.appendChild(elText('h1', 'News Digest'));
  const tabs = el('div', 'tabs');
  const tabButtons = {};
  for (const t of TABS) {
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.textContent = t.label;
    btn.addEventListener('click', () => selectTab(t.id));
    tabs.appendChild(btn);
    tabButtons[t.id] = btn;
  }
  header.appendChild(tabs);
  root.innerHTML = '';
  root.appendChild(header);

  const dateLine = el('div', 'date');
  const stats = el('div', 'stats');
  const panel = el('div');
  header.appendChild(dateLine);
  header.appendChild(stats);
  root.appendChild(panel);

  function selectTab(id) {
    activeTab = id;
    for (const t of TABS) {
      tabButtons[t.id].classList.toggle('active', t.id === id);
    }
    render(id);
  }

  // Resolve the digest generation time from the canonical `args` field.
  // Prefer `args.date` (UTC ISO-8601, e.g. "2026-09-17T03:00:00Z" — the
  // browser converts to local time on display). Fall back to `args.start`
  // for legacy digests, which is the epoch of the window START, not the
  // generation time (so it can be up to a day stale for daily digests).
  function getDigestDate(data) {
    const args = (data && data.args) || {};
    if (args.date) {
      const iso = String(args.date).replace(' ', 'T');
      const d = new Date(iso);
      if (!isNaN(d.getTime())) return { date: d, legacy: false };
    }
    if (args.start) return { date: new Date(args.start * 1000), legacy: true };
    return { date: new Date(NaN), legacy: false };
  }

  function render(id) {
    const data = dataByTab[id];
    panel.innerHTML = '';

    if (!data) {
      const empty = el('div', 'empty-state');
      empty.innerHTML = `No ${id} digest yet — the server writes ${TABS.find(t => t.id === id).file} when the next ${id} digest runs.`;
      panel.appendChild(empty);
    }

    const gen = getDigestDate(data);
    if (isNaN(gen.date.getTime())) {
      dateLine.textContent = '';
    } else {
      dateLine.textContent = gen.date.toLocaleString();
      if (gen.legacy) {
        dateLine.append(' (window start, legacy digest)');
      }
    }

    if (!data) {
      stats.innerHTML = '';
      return;
    }

    stats.innerHTML = `
      <div>Items: <span>${data.total_items}</span></div>
      <div>Noise: <span>${data.noise_count}</span></div>
      <div>Clusters: <span>${data.clusters.length}</span></div>
      <div>Time: <span>${data.elapsed_seconds.toFixed(1)}s</span></div>
    `;

    // ── Digest Text ──
    const digestDiv = el('div', 'digest-text');
    const sections = data.digest_text.split('\n\n');
    sections.forEach(section => {
      if (section.startsWith('## ')) {
        const h2 = document.createElement('h2');
        h2.textContent = section.replace('## ', '').split('\n')[0];
        digestDiv.appendChild(h2);
        // Any continuation lines after the heading
        appendBlocks(digestDiv, section.replace('## ', '').split('\n').slice(1));
      } else {
        // Note: sections are split on blank lines, but the model uses single
        // newlines within a block (e.g. Quick Hits bullet lines), so this
        // must be line-aware too.
        appendBlocks(digestDiv, section.split('\n'));
      }
    });
    panel.appendChild(digestDiv);

    // ── Clusters ──
    panel.appendChild(elText('div', 'Topic Clusters', 'clusters-header'));

    data.clusters
      .sort((a, b) => b.size - a.size)
      .forEach(cluster => {
        const card = el('div', 'cluster');

        // Meta
        const meta = el('div', 'cluster-meta');
        meta.innerHTML = `
          <div>Cluster <span class="label">#${cluster.label}</span></div>
          <div>Size: ${cluster.size}</div>
          <div>Rank: ${cluster.avg_rank.toFixed(2)}</div>
          <div>Novelty: ${cluster.avg_novelty.toFixed(2)}</div>
          <div>Density: ${cluster.avg_density.toFixed(2)}</div>
        `;
        card.appendChild(meta);

        // Sources
        if (cluster.top_sources && cluster.top_sources.length) {
          const src = el('div', 'cluster-sources');
          src.innerHTML = 'Sources: <span>' + cluster.top_sources.join(', ') + '</span>';
          card.appendChild(src);
        }

        // Summary
        const summary = el('div', 'cluster-summary');
        summary.textContent = cluster.summary.trim();
        card.appendChild(summary);

        // Tags
        if (cluster.top_tags && cluster.top_tags.length) {
          const tagsDiv = el('div', 'cluster-tags');
          cluster.top_tags.forEach(t => {
            const tag = el('span', 'tag');
            tag.textContent = t;
            tagsDiv.appendChild(tag);
          });
          card.appendChild(tagsDiv);
        }

        // Toggle + representative posts
        if (cluster.representative_texts && cluster.representative_texts.length) {
          const toggle = document.createElement('button');
          toggle.className = 'cluster-toggle';
          toggle.textContent = `Show posts (${cluster.representative_texts.length})`;
          card.appendChild(toggle);

          const repsDiv = el('div', 'cluster-reps');
          cluster.representative_texts.forEach(text => {
            const item = el('div', 'rep-item');
            item.innerHTML = text;
            repsDiv.appendChild(item);
          });
          card.appendChild(repsDiv);

          toggle.addEventListener('click', () => {
            const isOpen = repsDiv.classList.toggle('open');
            toggle.textContent = isOpen
              ? `Hide posts (${cluster.representative_texts.length})`
              : `Show posts (${cluster.representative_texts.length})`;
          });
        }

        panel.appendChild(card);
      });
  }

  selectTab(activeTab);

  // Minimal markdown for the digest text: "* item" / "- item" bullet lines
  // become <ul>/<li>, **bold** and *italic* are inlined. Content is
  // HTML-escaped first, so model output can't inject markup.
  function inline(text) {
    let s = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    return s;
  }

  function appendBlocks(parent, lines) {
    let list = null;
    let para = [];
    const flushPara = () => {
      if (!para.length) return;
      const p = document.createElement('p');
      p.innerHTML = inline(para.join(' '));
      parent.appendChild(p);
      para = [];
    };
    for (const raw of lines) {
      const line = raw.trim();
      const m = line.match(/^[*\-] +(.*)$/);
      if (m) {
        flushPara();
        if (!list) {
          list = document.createElement('ul');
          parent.appendChild(list);
        }
        const li = document.createElement('li');
        li.innerHTML = inline(m[1]);
        list.appendChild(li);
      } else if (line) {
        para.push(line);
      } else {
        flushPara();
      }
    }
    flushPara();
  }

  function el(tag, className) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    return e;
  }

  function elText(tag, text, className) {
    const e = el(tag, className);
    e.textContent = text;
    return e;
  }
})();
</script>

</body>
</html>
